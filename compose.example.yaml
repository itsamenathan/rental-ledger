# Example deployment. Put it behind your reverse proxy (TLS terminates there).
services:
  rental-ledger:
    image: rental-ledger:latest
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://rental.example.com
      # Optional OIDC (e.g. Pocket ID). Callback: ${PUBLIC_URL}/api/auth/oidc/callback
      # OIDC_ISSUER: https://id.example.com
      # OIDC_CLIENT_ID: ...
      # OIDC_CLIENT_SECRET: ...
      # OIDC_NAME: Pocket ID
      # OIDC_AUTO_CREATE: "false"
      # DISABLE_PASSWORD_LOGIN: "true"
      # Logs are JSON lines on stdout. Optional OpenTelemetry (OTLP/HTTP):
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318   # turns on traces
      # OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS?required}
      # OTEL_SERVICE_NAME: rental-ledger
      # OTEL_LOGS_EXPORTER: otlp      # also send logs (they still go to stdout)
      # LOG_LEVEL: info
    volumes:
      - rental-data:/data
    ports:
      - "3000:3000"
volumes:
  rental-data:
